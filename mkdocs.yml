site_name: "TECHNICAL DOCUMENTATION"
theme:
  name: material
  logo: assets/images/Rica.png
  favicon: assets/images/Rica.png
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Poppins
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  custom_dir: overrides



site_url: https://heliks-rica.net
site_description: Centralized engineering documentation workspace for the RICA mineral tracking ecosystem.
repo_name: heliks-technical-documentation
edit_uri: https://github.com/akirachix/heliks-technical-documentation/edit/main/docs/

theme:
  name: material
  logo: assets/images/Rica.png
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    - content.code.copy
    - search.suggest
    - search.highlight


plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Overview: architecture/system-context.md
  - Informational Website: frontend/frontend-info-architecture.md
  - Architecture: architecture/architecture-overview.md
  - Backend: backend/backend.md
  - Database: architecture/database.md
  - Frontend: frontend/frontend.md
  - Design: design/wireframes.md
  - Security: security/security.md
  - Glossary: architecture/glossary.md
